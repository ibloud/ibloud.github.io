name: Public ecosystem read-only checks
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'ecosystem/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/public-records.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/public-records.test.mjs
      - run: python3 tools/check_portfolio.py
      - name: Install isolated browser-test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/public-records-tools" playwright@1.65.0 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/public-records-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test static site, keyboard, reflow and accessibility
        env:
          NODE_PATH: ${{ runner.temp }}/public-records-tools/node_modules
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/public-records-http.log" 2>&1 &
          export CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tools/test_public_records_browser.cjs
