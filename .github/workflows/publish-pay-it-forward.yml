name: Publish PLAY IT FORWARD on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio GitHub Pages site
        uses: actions/checkout@v4
        with:
          path: portfolio
      - name: Checkout PLAY IT FORWARD app
        uses: actions/checkout@v4
        with:
          repository: Loptr-Lab/pay-it-forward
          ref: main
          path: app
      - name: Build static app
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Publish app routes at expected URLs
        run: |
          mkdir -p portfolio/adventure portfolio/route
          cp -R app/out/adventure/. portfolio/adventure/
          cp -R app/out/route/. portfolio/route/
          if [ -d app/out/_next ]; then
            cp -R app/out/_next portfolio/
          fi
          if [ -d app/public ]; then
            cp -R app/public/. portfolio/
          fi
          touch portfolio/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
