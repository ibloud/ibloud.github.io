name: Deck Workshop checks
on:
  pull_request:
    paths:
      - "deck-workshop/**"
      - ".github/workflows/deck-workshop.yml"
  push:
    branches:
      - "feat/deck-workshop-foundation"
    paths:
      - "deck-workshop/**"
      - ".github/workflows/deck-workshop.yml"
permissions:
  contents: read
jobs:
  workshop-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deck-workshop
    steps:
      - uses: actions/checkout@v4
      - name: Check workshop structure and source boundaries
        run: python3 test-workshop.py
